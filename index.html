<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SVG Laser Cutter Viewer – Präziser Zoom & Pan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #svg-container {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: grab;
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%),
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #svg-container:active {
            cursor: grabbing;
        }

        #main-svg {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
            background-color: #ffffff;
        }

        .toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 14px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .toolbar button {
            background: #f0f0f0;
            border: none;
            color: #333;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        .toolbar button:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .toolbar button:active {
            transform: scale(0.95);
        }

        .zoom-indicator {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            color: #333;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 1000;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .zoom-indicator span {
            color: #0066cc;
            font-weight: bold;
            margin-left: 5px;
        }

        .file-upload {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #ddd;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .file-upload:hover {
            background: #f8f8f8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .file-upload input {
            display: none;
        }

        .file-upload svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        .hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.5);
            font-size: 13px;
            z-index: 999;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="zoom-indicator">
        Zoom: <span id="zoom-level">100%</span>
    </div>

    <label class="file-upload" title="SVG-Datei öffnen">
        <svg viewBox="0 0 24 24">
            <path d="M19 13v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6M12 3v12m0-12 4 4m-4-4-4 4" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        SVG laden
        <input type="file" id="svg-file-input" accept=".svg">
    </label>

    <div id="svg-container">
        <!-- Standard Demo-SVG mit typischen Laser-Linien in Originalfarben -->
        <svg id="main-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Hintergrund Kontur in Schwarz -->
            <rect x="10" y="10" width="780" height="580" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- Linien in verschiedenen Farben (wie typisch für Lasercutting) -->
            <line x1="20" y1="300" x2="780" y2="300" stroke="#000000" stroke-width="1"/>
            <line x1="400" y1="20" x2="400" y2="580" stroke="#000000" stroke-width="1"/>
            
            <!-- Diagonalen in Rot für Schnittlinien -->
            <line x1="20" y1="20" x2="780" y2="580" stroke="#ff0000" stroke-width="1"/>
            <line x1="780" y1="20" x2="20" y2="580" stroke="#ff0000" stroke-width="1"/>
            
            <!-- Kreise in Blau für Gravur -->
            <circle cx="400" cy="300" r="180" fill="none" stroke="#0000ff" stroke-width="1"/>
            <circle cx="400" cy="300" r="100" fill="none" stroke="#0000ff" stroke-width="1" stroke-dasharray="10,5"/>
            
            <!-- Rechtecke in Grün -->
            <rect x="150" y="100" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="1.5"/>
            <rect x="570" y="100" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="1.5"/>
            <rect x="150" y="420" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="1.5"/>
            <rect x="570" y="420" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="1.5"/>
            
            <!-- Polygon in Orange -->
            <polygon points="300,200 500,200 550,350 250,350" fill="none" stroke="#ff6600" stroke-width="1.5"/>
            
            <!-- Text Beispiel (für Gravur) in Dunkelgrau -->
            <text x="400" y="500" font-family="Arial" font-size="30" fill="#333333" stroke="none" text-anchor="middle" dominant-baseline="middle">LASER</text>
            
            <!-- Feine Muster in Lila -->
            <path d="M100,450 L200,450 L150,500 Z" fill="none" stroke="#6600cc" stroke-width="1"/>
            <path d="M700,450 L600,450 L650,500 Z" fill="none" stroke="#6600cc" stroke-width="1"/>
        </svg>
    </div>

    <div class="toolbar">
        <button id="zoom-in" title="Vergrößern (Zoom In)">+</button>
        <button id="zoom-out" title="Verkleinern (Zoom Out)">−</button>
        <button id="zoom-reset" title="Zoom zurücksetzen">⟲</button>
        <button id="zoom-fit" title="Einpassen (Fit to screen)">⤢</button>
    </div>

    <div class="hint">
        🖱️ Ziehen zum Verschieben · Scrollrad zum Zoomen · Buttons für präzise Steuerung
    </div>

    <script>
        (function() {
            const container = document.getElementById('svg-container');
            const svg = document.getElementById('main-svg');
            const zoomLevelEl = document.getElementById('zoom-level');
            const zoomInBtn = document.getElementById('zoom-in');
            const zoomOutBtn = document.getElementById('zoom-out');
            const zoomResetBtn = document.getElementById('zoom-reset');
            const zoomFitBtn = document.getElementById('zoom-fit');
            const fileInput = document.getElementById('svg-file-input');

            let currentZoom = 1;
            let minZoom = 0.1;
            let maxZoom = 50;
            let panX = 0;
            let panY = 0;
            let startPanX = 0;
            let startPanY = 0;
            let isPanning = false;
            let startMouseX = 0;
            let startMouseY = 0;

            // Initiale Transformation anwenden
            function applyTransform() {
                svg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
                zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';
            }

            // Zoom Funktion - korrigiert für natürliches Verhalten
            function setZoom(newZoom, targetX, targetY) {
                newZoom = Math.min(maxZoom, Math.max(minZoom, newZoom));
                
                if (targetX !== undefined && targetY !== undefined) {
                    // Zoom zum Mauszeiger - korrigierte Version
                    const rect = container.getBoundingClientRect();
                    const containerCenterX = rect.left + rect.width / 2;
                    const containerCenterY = rect.top + rect.height / 2;
                    
                    // Position relativ zum Container-Zentrum
                    const relX = targetX - containerCenterX;
                    const relY = targetY - containerCenterY;
                    
                    // Alte Zoom-Werte speichern
                    const oldZoom = currentZoom;
                    
                    // Neue Zoom-Werte setzen
                    currentZoom = newZoom;
                    
                    // Neue Pan-Position berechnen
                    // Der Punkt unter dem Cursor soll an der gleichen Stelle bleiben
                    panX = (panX - relX) * (currentZoom / oldZoom) + relX;
                    panY = (panY - relY) * (currentZoom / oldZoom) + relY;
                } else {
                    currentZoom = newZoom;
                }
                
                applyTransform();
            }

            // Zoom In Button
            zoomInBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                setZoom(currentZoom * 1.5, centerX, centerY);
            });

            // Zoom Out Button
            zoomOutBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                setZoom(currentZoom / 1.5, centerX, centerY);
            });

            // Reset Zoom
            zoomResetBtn.addEventListener('click', () => {
                panX = 0;
                panY = 0;
                setZoom(1);
            });

            // Fit to screen
            zoomFitBtn.addEventListener('click', () => {
                const containerRect = container.getBoundingClientRect();
                
                // Berechne verfügbaren Platz (mit etwas Rand)
                const availableWidth = containerRect.width * 0.85;
                const availableHeight = containerRect.height * 0.85;
                
                // Aktuelle Größe des SVG
                const svgNaturalWidth = svg.viewBox.baseVal.width || 800;
                const svgNaturalHeight = svg.viewBox.baseVal.height || 600;
                
                // Berechne Zoom-Faktor
                const scaleX = availableWidth / svgNaturalWidth;
                const scaleY = availableHeight / svgNaturalHeight;
                const fitZoom = Math.min(scaleX, scaleY);
                
                panX = 0;
                panY = 0;
                setZoom(fitZoom);
            });

            // Scrollrad Zoom - natürliches Verhalten
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                // DeltaY negativ = nach oben scrollen = reinzoomen
                // DeltaY positiv = nach unten scrollen = rauszoomen
                const delta = e.deltaY < 0 ? 1.1 : 0.9;
                setZoom(currentZoom * delta, e.clientX, e.clientY);
            }, { passive: false });

            // Pan (Verschieben)
            container.addEventListener('mousedown', (e) => {
                if (e.target === container || container.contains(e.target)) {
                    isPanning = true;
                    startPanX = e.clientX;
                    startPanY = e.clientY;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    const dx = e.clientX - startPanX;
                    const dy = e.clientY - startPanY;
                    panX += dx;
                    panY += dy;
                    startPanX = e.clientX;
                    startPanY = e.clientY;
                    applyTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    container.style.cursor = 'grab';
                }
            });

            // Touch Unterstützung
            let lastTouchDistance = 0;
            let lastTouchCenter = { x: 0, y: 0 };
            let touchStartPanX = 0;
            let touchStartPanY = 0;
            let touchStartZoom = 1;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isPanning = true;
                    startPanX = e.touches[0].clientX;
                    startPanY = e.touches[0].clientY;
                    touchStartPanX = panX;
                    touchStartPanY = panY;
                } else if (e.touches.length === 2) {
                    isPanning = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
                    lastTouchCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                    touchStartZoom = currentZoom;
                }
                e.preventDefault();
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isPanning) {
                    const dx = e.touches[0].clientX - startPanX;
                    const dy = e.touches[0].clientY - startPanY;
                    panX = touchStartPanX + dx;
                    panY = touchStartPanY + dy;
                    applyTransform();
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const newDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (lastTouchDistance > 0) {
                        const scale = newDistance / lastTouchDistance;
                        const newZoom = touchStartZoom * scale;
                        setZoom(newZoom, lastTouchCenter.x, lastTouchCenter.y);
                    }
                }
                e.preventDefault();
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    lastTouchDistance = 0;
                }
                if (e.touches.length === 0) {
                    isPanning = false;
                }
            });

            // SVG Datei laden
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const svgContent = event.target.result;
                    
                    // Temporäres Element erstellen um das SVG zu parsen
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
                    const newSvg = svgDoc.documentElement;
                    
                    if (newSvg.tagName.toLowerCase() === 'svg') {
                        // Altes SVG ersetzen
                        const oldSvg = document.getElementById('main-svg');
                        
                        // Neue SVG vorbereiten
                        newSvg.id = 'main-svg';
                        newSvg.style.maxWidth = '90%';
                        newSvg.style.maxHeight = '90%';
                        newSvg.style.width = 'auto';
                        newSvg.style.height = 'auto';
                        newSvg.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.15))';
                        newSvg.style.transformOrigin = 'center center';
                        newSvg.style.transition = 'transform 0.05s ease-out';
                        newSvg.style.willChange = 'transform';
                        newSvg.style.backgroundColor = '#ffffff';
                        
                        // Originalfarben beibehalten - keine Änderungen an Farben
                        
                        // Ersetzen
                        oldSvg.replaceWith(newSvg);
                        
                        // Reset Ansicht
                        panX = 0;
                        panY = 0;
                        currentZoom = 1;
                        applyTransform();
                        
                        // Optional: Fit to screen
                        setTimeout(() => {
                            zoomFitBtn.click();
                        }, 100);
                    } else {
                        alert('Ungültige SVG-Datei');
                    }
                };
                
                reader.readAsText(file);
                // Input zurücksetzen für wiederholtes Laden
                fileInput.value = '';
            });

            // Tastatur-Steuerung
            window.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case '+':
                    case '=':
                        zoomInBtn.click();
                        break;
                    case '-':
                        zoomOutBtn.click();
                        break;
                    case '0':
                        zoomResetBtn.click();
                        break;
                    case 'f':
                    case 'F':
                        zoomFitBtn.click();
                        break;
                    case 'ArrowLeft':
                        panX -= 50;
                        applyTransform();
                        break;
                    case 'ArrowRight':
                        panX += 50;
                        applyTransform();
                        break;
                    case 'ArrowUp':
                        panY -= 50;
                        applyTransform();
                        break;
                    case 'ArrowDown':
                        panY += 50;
                        applyTransform();
                        break;
                }
            });

            // Initial anwenden
            applyTransform();
            
            // Initial auf Einpassen setzen nach kurzer Verzögerung
            setTimeout(() => {
                zoomFitBtn.click();
            }, 200);
        })();
    </script>
</body>
</html>
