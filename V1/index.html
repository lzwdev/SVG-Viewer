<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SVG Laser Cutter Viewer – Precision Zoom & Pan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e8e8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #svg-container {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: grab;
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%),
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #svg-container:active {
            cursor: grabbing;
        }

        #main-svg {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
            transform-origin: center center;
            will-change: transform;
            background-color: #ffffff;
            display: block;
        }

        /* IMPORTANT: Make thin lines visible */
        #main-svg * {
            vector-effect: non-scaling-stroke;
        }

        /* Thicken all lines and paths */
        #main-svg path:not([stroke-width]),
        #main-svg line:not([stroke-width]),
        #main-svg polyline:not([stroke-width]),
        #main-svg polygon:not([stroke-width]),
        #main-svg rect:not([stroke-width]),
        #main-svg circle:not([stroke-width]),
        #main-svg ellipse:not([stroke-width]) {
            stroke-width: 2px;
        }

        /* Thicken existing thin lines */
        #main-svg path[stroke-width="0.5"],
        #main-svg line[stroke-width="0.5"],
        #main-svg polyline[stroke-width="0.5"],
        #main-svg polygon[stroke-width="0.5"],
        #main-svg rect[stroke-width="0.5"],
        #main-svg circle[stroke-width="0.5"],
        #main-svg ellipse[stroke-width="0.5"],
        #main-svg path[stroke-width="1"],
        #main-svg line[stroke-width="1"],
        #main-svg polyline[stroke-width="1"],
        #main-svg polygon[stroke-width="1"],
        #main-svg rect[stroke-width="1"],
        #main-svg circle[stroke-width="1"],
        #main-svg ellipse[stroke-width="1"] {
            stroke-width: 2px;
        }

        /* Even thinner lines */
        #main-svg path[stroke-width="0.1"],
        #main-svg line[stroke-width="0.1"],
        #main-svg polyline[stroke-width="0.1"],
        #main-svg polygon[stroke-width="0.1"],
        #main-svg rect[stroke-width="0.1"],
        #main-svg circle[stroke-width="0.1"],
        #main-svg ellipse[stroke-width="0.1"],
        #main-svg path[stroke-width="0.2"],
        #main-svg line[stroke-width="0.2"],
        #main-svg polyline[stroke-width="0.2"],
        #main-svg polygon[stroke-width="0.2"],
        #main-svg rect[stroke-width="0.2"],
        #main-svg circle[stroke-width="0.2"],
        #main-svg ellipse[stroke-width="0.2"],
        #main-svg path[stroke-width="0.3"],
        #main-svg line[stroke-width="0.3"],
        #main-svg polyline[stroke-width="0.3"],
        #main-svg polygon[stroke-width="0.3"],
        #main-svg rect[stroke-width="0.3"],
        #main-svg circle[stroke-width="0.3"],
        #main-svg ellipse[stroke-width="0.3"],
        #main-svg path[stroke-width="0.4"],
        #main-svg line[stroke-width="0.4"],
        #main-svg polyline[stroke-width="0.4"],
        #main-svg polygon[stroke-width="0.4"],
        #main-svg rect[stroke-width="0.4"],
        #main-svg circle[stroke-width="0.4"],
        #main-svg ellipse[stroke-width="0.4"] {
            stroke-width: 2.5px;
        }

        .toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 14px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .toolbar button {
            background: #f0f0f0;
            border: none;
            color: #333;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        .toolbar button:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .toolbar button:active {
            transform: scale(0.95);
        }

        .zoom-indicator {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            color: #333;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 1000;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .zoom-indicator span {
            color: #0066cc;
            font-weight: bold;
            margin-left: 5px;
        }

        .file-upload {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #ddd;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .file-upload:hover {
            background: #f8f8f8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .file-upload input {
            display: none;
        }

        .file-upload svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        .hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.5);
            font-size: 13px;
            z-index: 999;
            pointer-events: none;
            text-align: center;
        }

        .line-thickness-toggle {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #ddd;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .line-thickness-toggle:hover {
            background: #f8f8f8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .line-thickness-toggle.active {
            background: #0066cc;
            color: white;
            border-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="zoom-indicator">
        Zoom: <span id="zoom-level">100%</span>
    </div>

    <button class="line-thickness-toggle active" id="thickness-toggle" title="Toggle line thickening">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="2" y1="12" x2="22" y2="12" stroke-width="4"/>
            <line x1="2" y1="12" x2="22" y2="12" stroke-width="1"/>
        </svg>
        Thicken lines: ON
    </button>

    <label class="file-upload" title="Open SVG file">
        <svg viewBox="0 0 24 24">
            <path d="M19 13v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6M12 3v12m0-12 4 4m-4-4-4 4" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Load SVG
        <input type="file" id="svg-file-input" accept=".svg">
    </label>

    <div id="svg-container">
        <!-- Default demo SVG with typical laser cutting lines in original colors -->
        <svg id="main-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width: 800px; height: 600px;">
            <!-- White background -->
            <rect width="800" height="600" fill="white"/>
            
            <!-- Background outline in black -->
            <rect x="10" y="10" width="780" height="580" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- Lines in various colors (typical for laser cutting) -->
            <line x1="20" y1="300" x2="780" y2="300" stroke="#000000" stroke-width="0.5"/>
            <line x1="400" y1="20" x2="400" y2="580" stroke="#000000" stroke-width="0.5"/>
            
            <!-- Diagonals in red for cutting lines -->
            <line x1="20" y1="20" x2="780" y2="580" stroke="#ff0000" stroke-width="0.5"/>
            <line x1="780" y1="20" x2="20" y2="580" stroke="#ff0000" stroke-width="0.5"/>
            
            <!-- Circles in blue for engraving -->
            <circle cx="400" cy="300" r="180" fill="none" stroke="#0000ff" stroke-width="0.5"/>
            <circle cx="400" cy="300" r="100" fill="none" stroke="#0000ff" stroke-width="0.5" stroke-dasharray="10,5"/>
            
            <!-- Rectangles in green -->
            <rect x="150" y="100" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="0.5"/>
            <rect x="570" y="100" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="0.5"/>
            <rect x="150" y="420" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="0.5"/>
            <rect x="570" y="420" width="80" height="80" fill="none" stroke="#00aa00" stroke-width="0.5"/>
            
            <!-- Polygon in orange -->
            <polygon points="300,200 500,200 550,350 250,350" fill="none" stroke="#ff6600" stroke-width="0.5"/>
            
            <!-- Text example (for engraving) in dark gray -->
            <text x="400" y="500" font-family="Arial" font-size="30" fill="#333333" text-anchor="middle" dominant-baseline="middle">LASER</text>
            
            <!-- Fine patterns in purple -->
            <path d="M100,450 L200,450 L150,500 Z" fill="none" stroke="#6600cc" stroke-width="0.3"/>
            <path d="M700,450 L600,450 L650,500 Z" fill="none" stroke="#6600cc" stroke-width="0.3"/>
        </svg>
    </div>

    <div class="toolbar">
        <button id="zoom-in" title="Zoom In">+</button>
        <button id="zoom-out" title="Zoom Out">−</button>
        <button id="zoom-reset" title="Reset Zoom">⟲</button>
        <button id="zoom-fit" title="Fit to Screen">⤢</button>
    </div>

    <div class="hint">
        🖱️ Drag to pan · Scroll wheel to zoom · Toggle for line thickening
    </div>

    <script>
        (function() {
            const container = document.getElementById('svg-container');
            const zoomLevelEl = document.getElementById('zoom-level');
            const zoomInBtn = document.getElementById('zoom-in');
            const zoomOutBtn = document.getElementById('zoom-out');
            const zoomResetBtn = document.getElementById('zoom-reset');
            const zoomFitBtn = document.getElementById('zoom-fit');
            const fileInput = document.getElementById('svg-file-input');
            const thicknessToggle = document.getElementById('thickness-toggle');

            let currentZoom = 1;
            let minZoom = 0.01;
            let maxZoom = 100;
            let panX = 0;
            let panY = 0;
            let startPanX = 0;
            let startPanY = 0;
            let isPanning = false;
            let thickLinesEnabled = true;

            // Function to get current SVG element
            function getCurrentSvg() {
                return document.getElementById('main-svg');
            }

            // Function to thicken lines
            function applyLineThickness() {
                const svg = getCurrentSvg();
                if (!svg) return;
                
                const lineElements = svg.querySelectorAll('path, line, polyline, polygon, rect, circle, ellipse');
                
                lineElements.forEach(element => {
                    if (thickLinesEnabled) {
                        // Store original stroke width if not already stored
                        if (!element.dataset.originalStrokeWidth) {
                            element.dataset.originalStrokeWidth = element.getAttribute('stroke-width') || '1';
                        }
                        
                        const originalWidth = parseFloat(element.dataset.originalStrokeWidth);
                        
                        // Only thicken thin lines
                        if (originalWidth < 1.5) {
                            element.setAttribute('stroke-width', '2');
                        }
                    } else {
                        // Reset to original
                        if (element.dataset.originalStrokeWidth) {
                            element.setAttribute('stroke-width', element.dataset.originalStrokeWidth);
                        }
                    }
                });
            }

            // Toggle line thickening
            thicknessToggle.addEventListener('click', () => {
                thickLinesEnabled = !thickLinesEnabled;
                
                if (thickLinesEnabled) {
                    thicknessToggle.classList.add('active');
                    thicknessToggle.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="2" y1="12" x2="22" y2="12" stroke-width="4"/>
                            <line x1="2" y1="12" x2="22" y2="12" stroke-width="1"/>
                        </svg>
                        Thicken lines: ON
                    `;
                } else {
                    thicknessToggle.classList.remove('active');
                    thicknessToggle.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="2" y1="12" x2="22" y2="12" stroke-width="1"/>
                        </svg>
                        Thicken lines: OFF
                    `;
                }
                
                applyLineThickness();
            });

            // Apply initial transformation
            function applyTransform() {
                const svg = getCurrentSvg();
                if (svg) {
                    svg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
                    zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';
                }
            }

            // Zoom function
            function setZoom(newZoom, targetX, targetY) {
                newZoom = Math.min(maxZoom, Math.max(minZoom, newZoom));
                
                if (targetX !== undefined && targetY !== undefined) {
                    const rect = container.getBoundingClientRect();
                    const containerCenterX = rect.left + rect.width / 2;
                    const containerCenterY = rect.top + rect.height / 2;
                    
                    const relX = targetX - containerCenterX;
                    const relY = targetY - containerCenterY;
                    
                    const oldZoom = currentZoom;
                    currentZoom = newZoom;
                    
                    panX = (panX - relX) * (currentZoom / oldZoom) + relX;
                    panY = (panY - relY) * (currentZoom / oldZoom) + relY;
                } else {
                    currentZoom = newZoom;
                }
                
                applyTransform();
            }

            // Zoom In button
            zoomInBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                setZoom(currentZoom * 1.5, centerX, centerY);
            });

            // Zoom Out button
            zoomOutBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                setZoom(currentZoom / 1.5, centerX, centerY);
            });

            // Reset Zoom
            zoomResetBtn.addEventListener('click', () => {
                panX = 0;
                panY = 0;
                setZoom(1);
            });

            // Fit to screen
            zoomFitBtn.addEventListener('click', () => {
                const svg = getCurrentSvg();
                if (!svg) return;
                
                const containerRect = container.getBoundingClientRect();
                const availableWidth = containerRect.width * 0.85;
                const availableHeight = containerRect.height * 0.85;
                
                let svgWidth, svgHeight;
                
                if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
                    svgWidth = svg.viewBox.baseVal.width;
                    svgHeight = svg.viewBox.baseVal.height;
                } else {
                    const bounds = svg.getBoundingClientRect();
                    svgWidth = bounds.width || 800;
                    svgHeight = bounds.height || 600;
                }
                
                const scaleX = availableWidth / svgWidth;
                const scaleY = availableHeight / svgHeight;
                const fitZoom = Math.min(scaleX, scaleY, 50);
                
                panX = 0;
                panY = 0;
                setZoom(Math.max(fitZoom, 0.1));
            });

            // Scroll wheel zoom
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 1.1 : 0.9;
                setZoom(currentZoom * delta, e.clientX, e.clientY);
            }, { passive: false });

            // Pan (dragging)
            container.addEventListener('mousedown', (e) => {
                isPanning = true;
                startPanX = e.clientX;
                startPanY = e.clientY;
                container.style.cursor = 'grabbing';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    const dx = e.clientX - startPanX;
                    const dy = e.clientY - startPanY;
                    panX += dx;
                    panY += dy;
                    startPanX = e.clientX;
                    startPanY = e.clientY;
                    applyTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    container.style.cursor = 'grab';
                }
            });

            // Touch support
            let lastTouchDistance = 0;
            let lastTouchCenter = { x: 0, y: 0 };
            let touchStartPanX = 0;
            let touchStartPanY = 0;
            let touchStartZoom = 1;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isPanning = true;
                    startPanX = e.touches[0].clientX;
                    startPanY = e.touches[0].clientY;
                    touchStartPanX = panX;
                    touchStartPanY = panY;
                } else if (e.touches.length === 2) {
                    isPanning = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
                    lastTouchCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                    touchStartZoom = currentZoom;
                }
                e.preventDefault();
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isPanning) {
                    const dx = e.touches[0].clientX - startPanX;
                    const dy = e.touches[0].clientY - startPanY;
                    panX = touchStartPanX + dx;
                    panY = touchStartPanY + dy;
                    applyTransform();
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const newDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (lastTouchDistance > 0) {
                        const scale = newDistance / lastTouchDistance;
                        const newZoom = touchStartZoom * scale;
                        setZoom(newZoom, lastTouchCenter.x, lastTouchCenter.y);
                    }
                }
                e.preventDefault();
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    lastTouchDistance = 0;
                }
                if (e.touches.length === 0) {
                    isPanning = false;
                }
            });

            // Load SVG file
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    try {
                        const svgContent = event.target.result;
                        
                        const parser = new DOMParser();
                        const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
                        
                        if (svgDoc.querySelector('parsererror')) {
                            alert('Invalid SVG file');
                            return;
                        }
                        
                        const newSvg = svgDoc.documentElement;
                        
                        if (newSvg.tagName.toLowerCase() !== 'svg') {
                            alert('Not a valid SVG file');
                            return;
                        }
                        
                        const oldSvg = getCurrentSvg();
                        
                        newSvg.id = 'main-svg';
                        
                        newSvg.style.maxWidth = 'none';
                        newSvg.style.maxHeight = 'none';
                        newSvg.style.width = 'auto';
                        newSvg.style.height = 'auto';
                        newSvg.style.display = 'block';
                        newSvg.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.15))';
                        newSvg.style.transformOrigin = 'center center';
                        newSvg.style.willChange = 'transform';
                        newSvg.style.backgroundColor = '#ffffff';
                        
                        if (!newSvg.getAttribute('viewBox')) {
                            let width = 800;
                            let height = 600;
                            
                            const widthAttr = newSvg.getAttribute('width');
                            const heightAttr = newSvg.getAttribute('height');
                            
                            if (widthAttr) width = parseFloat(widthAttr) || 800;
                            if (heightAttr) height = parseFloat(heightAttr) || 600;
                            
                            newSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
                        }
                        
                        const hasBackground = Array.from(newSvg.children).some(child => {
                            return child.tagName.toLowerCase() === 'rect' && 
                                   child.getAttribute('fill') === 'white' &&
                                   parseFloat(child.getAttribute('width')) > 100;
                        });
                        
                        if (!hasBackground) {
                            const viewBox = newSvg.getAttribute('viewBox').split(' ');
                            const vbWidth = parseFloat(viewBox[2]) || 800;
                            const vbHeight = parseFloat(viewBox[3]) || 600;
                            
                            const background = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                            background.setAttribute('width', vbWidth);
                            background.setAttribute('height', vbHeight);
                            background.setAttribute('fill', 'white');
                            newSvg.insertBefore(background, newSvg.firstChild);
                        }
                        
                        if (oldSvg) {
                            oldSvg.replaceWith(newSvg);
                        } else {
                            container.appendChild(newSvg);
                        }
                        
                        // Apply line thickening
                        applyLineThickness();
                        
                        panX = 0;
                        panY = 0;
                        currentZoom = 1;
                        applyTransform();
                        
                        setTimeout(() => {
                            zoomFitBtn.click();
                        }, 200);
                        
                    } catch (error) {
                        console.error('Error loading file:', error);
                        alert('Error loading SVG file: ' + error.message);
                    }
                };
                
                reader.onerror = () => {
                    alert('Error reading file');
                };
                
                reader.readAsText(file);
                fileInput.value = '';
            });

            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case '+':
                    case '=':
                        zoomInBtn.click();
                        break;
                    case '-':
                        zoomOutBtn.click();
                        break;
                    case '0':
                        zoomResetBtn.click();
                        break;
                    case 'f':
                    case 'F':
                        zoomFitBtn.click();
                        break;
                    case 't':
                    case 'T':
                        thicknessToggle.click();
                        break;
                    case 'ArrowLeft':
                        panX -= 50;
                        applyTransform();
                        break;
                    case 'ArrowRight':
                        panX += 50;
                        applyTransform();
                        break;
                    case 'ArrowUp':
                        panY -= 50;
                        applyTransform();
                        break;
                    case 'ArrowDown':
                        panY += 50;
                        applyTransform();
                        break;
                }
            });

            // Initialize
            applyTransform();
            applyLineThickness();
            
            setTimeout(() => {
                zoomFitBtn.click();

        })();
